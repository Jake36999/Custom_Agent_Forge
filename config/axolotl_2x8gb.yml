# ============================================================
# Aletheia V2.1 QLoRA Training Config
# Target: 2x 8GB GPUs (16GB total VRAM)
# Dataset: 1,467 elite ChatML rows (P99=927 tokens, max=2048)
# ============================================================

# --- Base Model & Quantization ---
base_model: meta-llama/Meta-Llama-3-8B-Instruct
model_type: LlamaForCausalLM
tokenizer_type: AutoTokenizer
trust_remote_code: true

load_in_4bit: true
adapter: qlora
qlora_quantize_base_model: true

# --- Dataset ---
datasets:
  - path: output/datasets/coding_assistant/qlora_skill_dataset_balanced.jsonl
    type: chatml
    ds_type: json
  - path: output/datasets/theorist/qlora_theorist_dataset.jsonl
    type: chatml
    ds_type: json
  - path: output/datasets/veteran/qlora_veteran_dataset.jsonl
    type: chatml
    ds_type: json

chat_template: chatml
train_on_inputs: false     # Loss on assistant turns ONLY (matches our train_loss masking)

# --- Context Window ---
# P99=927, max=2048 after truncation filter.
# 2048 fits in ~6.5GB with 4-bit quantization + gradient checkpointing.
sequence_len: 2048

# --- LoRA Configuration ---
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
lora_target_linear: true

# --- Micro-Batching (8GB per card) ---
micro_batch_size: 1
eval_batch_size: 1
gradient_accumulation_steps: 8   # Effective batch = 2 GPUs * 1 * 8 = 16
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false

# --- Training Hyperparameters ---
# 1,467 elite rows: low LR + 3 epochs to prevent overfitting
num_epochs: 3
learning_rate: 1.5e-5
weight_decay: 0.01
lr_scheduler: cosine
warmup_ratio: 0.05
optimizer: adamw_torch

# --- Precision & Memory ---
bf16: auto
tf32: true
flash_attention: true

# --- Eval & Checkpointing ---
val_set_size: 0.05          # 5% holdout (~73 rows)
eval_steps: 50
save_steps: 100
save_total_limit: 3
logging_steps: 10

output_dir: ./runs/aletheia-v2.1-qlora

# --- Misc ---
seed: 42
pad_to_sequence_len: true
sample_packing: true        # Pack short sequences together to maximize GPU utilization
