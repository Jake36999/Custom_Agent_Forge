      SCORED    = "SCORED"
      ACCEPTED  = "ACCEPTED"
      REJECTED  = "REJECTED"
      REROLL    = "REROLL"
  
      TERMINAL = frozenset({ACCEPTED, REJECTED})
      ACTIVE   = frozenset({CREATED, VALIDATED, SCORED, REROLL})
      # Legacy states from pre-v5 pipelines (mapped to ACTIVE during bootstrap)
