  import argparse
  import json
  import sys
  from pathlib import Path
  from dataclasses import dataclass, asdict
  from typing import List, Dict, Any
  
  try:
      from jupyter_trace_ingestor import load_notebook, stream_cells
  except ImportError:
      print("[!] Critical Import Error: Ensure jupyter_trace_ingestor.py is in the PYTHONPATH.")
      sys.exit(1)
  
  @dataclass
  class AdvocatePayload:
      theory_text: str
      implementation_code: str
      text_to_code_ratio: float
  
  class AdvocateExtractor:
      def __init__(self, target_ratio: float):
          self.target_ratio = target_ratio
          self.markdown_buffer = []
  
      def process_stream(self, cell_stream) -> List[AdvocatePayload]:
          payloads = []
          for cell in cell_stream:
              cell_type = cell.get('cell_type')
              source = cell.get('source_code', '').strip()
              has_error = any(out.get('type') == 'error' for out in cell.get('outputs', []))
              
              if not source: continue
  
              if cell_type == 'markdown':
                  self.markdown_buffer.append(source)
              elif cell_type == 'code':
                  if has_error:
                      self.markdown_buffer.clear()
                      continue
                  if self.markdown_buffer:
                      theory_text = "\n\n".join(self.markdown_buffer)
                      text_vol = len(theory_text)
                      code_vol = len(source)
                      total_vol = text_vol + code_vol
                      
                      if total_vol > 0:
                          ratio = text_vol / total_vol
                          if ratio >= self.target_ratio:
                              payloads.append(AdvocatePayload(
                                  theory_text=theory_text,
                                  implementation_code=source,
                                  text_to_code_ratio=round(ratio, 3)
                              ))
                  self.markdown_buffer.clear()
          return payloads
  
  def process_manifest(manifest_path: Path, output_dir: Path, target_ratio: float):
      if not manifest_path.exists(): sys.exit(1)
      with open(manifest_path, 'r', encoding='utf-8') as f:
          targets = [line.strip() for line in f if line.strip()]
          
      output_dir.mkdir(parents=True, exist_ok=True)
      for target in targets:
          target_path = Path(target)
          if not target_path.exists(): continue
          try:
              nb_node = load_notebook(str(target_path))
              cell_stream = stream_cells(nb_node)
              extractor = AdvocateExtractor(target_ratio)
              payloads = extractor.process_stream(cell_stream)
              if payloads:
                  out_file = output_dir / f"{target_path.stem}_advocate_extract.json"
                  with open(out_file, 'w', encoding='utf-8') as f:
                      json.dump([asdict(p) for p in payloads], f, indent=2)
          except Exception as e:
              print(f"[!] Error on {target_path.name}: {e}")
  
  if __name__ == "__main__":
      parser = argparse.ArgumentParser()
      parser.add_argument("--manifest", required=True)
      parser.add_argument("--output-dir", required=True)
      parser.add_argument("--ratio", type=float, required=True)
      args = parser.parse_args()
      process_manifest(Path(args.manifest), Path(args.output_dir), args.ratio)

