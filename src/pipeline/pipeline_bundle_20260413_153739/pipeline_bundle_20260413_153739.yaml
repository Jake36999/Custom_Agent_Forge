      for run_dir in runs_path.iterdir():
          if run_dir.is_dir():
              manifest_file = run_dir / "manifest.json"
              if manifest_file.exists():
                  try:
                      with open(manifest_file, 'r', encoding='utf-8') as f:
                          man = json.load(f)
                          if man.get("status") not in ["completed"]:
                              resumable.append(man)
                  except Exception:
