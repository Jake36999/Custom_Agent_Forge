  """
  Aletheia DAG Scoring Pass v1.0
  -------------------------------
  Post-extraction DAG scoring bridge. Converts raw extraction payloads (veteran,
  advocate, coding_assistant, hybrid) into AletheiaSkill nodes, runs them through
  DAGRuntime (ACS + SIE + unified confidence + constraint propagation), and writes
  scored results back.
  
  Called by Agent_Forge_orchestrator between Step 2 (extraction) and Step 3 (formatting).
  """
  
  import argparse
  import json
  import logging
  import sys
  import uuid
  import yaml
  from pathlib import Path
  from typing import Any, Dict, List, Optional
  
  logging.basicConfig(level=logging.INFO, format="%(levelname)s: %(message)s")
  logger = logging.getLogger("Advocate.DAGScoringPass")
  
  try:
      from src.pipeline.dag_runtime import DAGRuntime, InMemoryEpistemicGraph
      from src.pipeline.acs_engine import ACSExecutionGovernor
      from src.core.models import AletheiaSkill
  except ImportError as e:
      logger.error(f"Failed to import DAG/ACS modules: {e}")
      sys.exit(1)
  
  
  # ---------------------------------------------------------------------------
  # Trajectory Builder — Constructs Tikhonov-compatible confusion matrix &
  # response vector from veteran diagnostic execution patterns.
  # ---------------------------------------------------------------------------
  
  def _build_veteran_trajectory(
      execution_pattern: List[str],
      traceback_text: str,
      diff: str,
      resolved_code: str,
  ) -> Dict[str, Any]:
      """Build a reasoning_trajectory dict with confusion_matrix and response_vector.
  
      Each row of the confusion_matrix encodes four binary/continuous signals:
          [has_traceback, has_diff, has_resolution, step_confidence]
  
      The response_vector contains per-step resolution scores:
          1.0 if the step produced a fix, 0.0 otherwise.
      """
      has_tb = 1.0 if traceback_text else 0.0
      has_diff = 1.0 if diff else 0.0
      has_res = 1.0 if resolved_code else 0.0
  
      confusion_matrix: List[List[float]] = []
      response_vector: List[float] = []
      steps: List[Dict[str, Any]] = []
  
      for step_label in execution_pattern:
          sl = step_label.lower()
          if sl in ("fix", "resolution", "resolved"):
              row = [has_tb, has_diff, has_res, 1.0]
              rv = 1.0
          elif sl in ("error", "traceback", "failure"):
              row = [has_tb, 0.0, 0.0, 0.0]
              rv = 0.0
          elif sl in ("diagnosis", "analysis", "diagnostic"):
              row = [has_tb, 0.0, 0.0, 0.5]
              rv = 0.0
          else:  # attempt, unknown
              row = [0.0, 0.0, 0.0, 0.5]
              rv = 0.0
          confusion_matrix.append(row)
          response_vector.append(rv)
          steps.append({
              "attempt_code": "",
              "error": "" if sl not in ("error", "traceback", "failure") else "diagnostic step",
              "diagnosis": step_label if sl in ("diagnosis", "analysis", "diagnostic") else "",
              "fix": "" if rv == 0.0 else "resolution applied",
          })
  
      return {
          "steps": steps,
          "confusion_matrix": confusion_matrix,
          "response_vector": response_vector,
          "labels": execution_pattern,
          "metadata": {
              "has_traceback": bool(traceback_text),
              "has_diff": bool(diff),
              "has_resolution": bool(resolved_code),
          },
      }
  
  
  # ---------------------------------------------------------------------------
  # Payload → AletheiaSkill converters (one per extraction mode)
  # ---------------------------------------------------------------------------
  
  def _wrap_veteran_payload(payload: Dict[str, Any], source_file: str) -> Dict[str, Any]:
      """Convert veteran extraction JSON into an AletheiaSkill-shaped dict."""
      node_id = payload.get("node_id", f"vet_{uuid.uuid4().hex[:8]}")
      code = payload.get("resolved_code", payload.get("attempt_code", ""))
      traceback_text = payload.get("error_traceback", payload.get("traceback", ""))
      diff = payload.get("successful_diff", payload.get("diff", ""))
  
      execution_pattern = payload.get("execution_pattern", ["attempt", "error", "diagnosis", "fix"])
      trajectory = _build_veteran_trajectory(execution_pattern, traceback_text, diff, code)
  
      return {
          "node_id": node_id,
          "name": f"veteran_diagnostic_{node_id}",
          "file": source_file,
          "code_snippet": code,
          "imports": [],
          "operator_type": "veteran_diagnostic",
          "source_type": "veteran_diagnostic",
          "skill_type": "execution",
          "teaching_layer": {
              "skill_identity": {"name": f"veteran_diagnostic_{node_id}"},
              "method_metadata": {"name": node_id, "language": "python"},
              "reasoning_vectors": {
                  "intent": "Diagnose and resolve execution failure",
                  "strategy": "Error trace analysis → root cause → corrective diff",
                  "constraints": [f"traceback_present={bool(traceback_text)}"],
                  "execution_pattern": execution_pattern,
                  "failure_modes": ["incomplete_traceback", "empty_diff"],
              },
              "implementation_template": {"code": code},
          },
          "semantics": {
              "traceback": traceback_text,
              "diff": diff,
              "resolved_code": code,
              "orchestration_mode": "veteran",
              "reasoning_trajectory": trajectory,
          },
          "epistemic": {"state": "CREATED", "c_node": 0.5},
      }
  
  
  def _wrap_advocate_payload(payload: Dict[str, Any], source_file: str) -> Dict[str, Any]:
      """Convert advocate extraction JSON into an AletheiaSkill-shaped dict."""
      node_id = payload.get("node_id", f"adv_{uuid.uuid4().hex[:8]}")
      theory = payload.get("theory_text", "")
      impl = payload.get("implementation_code", "")
      ratio = payload.get("text_to_code_ratio", 0.0)
  
      return {
          "node_id": node_id,
          "name": f"advocate_theory_{node_id}",
          "file": source_file,
          "code_snippet": impl,
          "imports": [],
          "operator_type": "advocate_theory",
          "source_type": "advocate_theory",
          "skill_type": "execution",
          "teaching_layer": {
              "skill_identity": {"name": f"advocate_theory_{node_id}"},
              "method_metadata": {"name": node_id, "language": "python"},
              "reasoning_vectors": {
                  "intent": "Architectural critique with implementation",
                  "strategy": "Dialectical adversarial review",
                  "constraints": [f"text_to_code_ratio={ratio:.3f}"],
                  "execution_pattern": ["theory", "critique", "implementation"],
                  "failure_modes": ["insufficient_theory", "low_semantic_density"],
              },
              "implementation_template": {"code": impl},
          },
          "semantics": {
              "theory": theory,
              "implementation": impl,
              "orchestration_mode": "advocate",
          },
          "epistemic": {"state": "CREATED", "c_node": 0.5},
      }
  
  
  def _wrap_coding_payload(payload: Dict[str, Any], source_file: str) -> Dict[str, Any]:
      """Ensure coding_assistant payloads have all required AletheiaSkill fields."""
      # These payloads are already close to AletheiaSkill shape from CognitiveProcessor
      if "node_id" not in payload:
          payload["node_id"] = f"code_{uuid.uuid4().hex[:8]}"
      if "operator_type" not in payload or not payload["operator_type"]:
          payload["operator_type"] = "function"
      if "semantics" not in payload or not isinstance(payload.get("semantics"), dict):
          payload["semantics"] = payload.get("semantics") or {}
      if "orchestration_mode" not in payload.get("semantics", {}):
          payload.setdefault("semantics", {})["orchestration_mode"] = "coding_assistant"
      # Rename code_snippet → implementation for CodingOutput contract
      sem = payload.get("semantics", {})
      if "code_snippet" in sem and "implementation" not in sem:
          sem["implementation"] = sem.pop("code_snippet")
      # Strip extra fields that violate extra="forbid"
      for _k in ("name", "extracted_patterns"):
          sem.pop(_k, None)
      if "epistemic" not in payload:
          payload["epistemic"] = {"state": "CREATED", "c_node": 0.5}
      elif isinstance(payload["epistemic"], dict) and "state" not in payload["epistemic"]:
          payload["epistemic"]["state"] = "CREATED"
      return payload
  
  
  def _detect_payload_mode(payload: Dict[str, Any]) -> str:
      """Infer extraction mode from payload structure."""
      if "traceback" in payload or "error_traceback" in payload:
          return "veteran"
      if "theory_text" in payload and "implementation_code" in payload:
          return "advocate"
      if "node_id" in payload and "code_snippet" in payload:
          return "coding_assistant"
      return "unknown"
  
  
  # ---------------------------------------------------------------------------
  # Output sanitization — strip internal scoring mechanics to prevent
  # the LLM from learning the heuristic scoring system rather than the
  # underlying logic (Phase 4: Cryptographic Dataset Generation).
  # ---------------------------------------------------------------------------
  
  _INTERNAL_SEMANTICS_KEYS = frozenset({
      "system_centrality_blast_radius",
      "_acs_trajectory",
      "_governance_directive",
      "_acs_structured_constraints",
      "_reroll_context",
  })
  
  _INTERNAL_NODE_KEYS = frozenset({
      "sie_node",
      "v_score",
      "acs_handshake_sid",
      "acs_violations",
      "acs_audited",
  })
  
  
  def sanitize_scored_node(node_dict: Dict[str, Any]) -> Dict[str, Any]:
      """
      Strip internal scoring mechanics, PageRank calculations, and raw SIE
      values from the output payload. This mathematically prevents the LLM
      from learning the heuristic scoring system rather than the underlying logic.
      """
      # Remove top-level internal fields
      for k in _INTERNAL_NODE_KEYS:
          node_dict.pop(k, None)
  
      # Remove internal keys from semantics
      sem = node_dict.get("semantics")
      if isinstance(sem, dict):
          for k in _INTERNAL_SEMANTICS_KEYS:
              sem.pop(k, None)
  
      # Strip confidence decomposition (prevents learning the scoring formula)
      ep = node_dict.get("epistemic")
      if isinstance(ep, dict):
          ep.pop("confidence", None)
  
      return node_dict
  
  
  def wrap_payload(payload: Dict[str, Any], mode: str, source_file: str) -> Optional[Dict[str, Any]]:
      """Convert a raw extraction payload to AletheiaSkill-shaped dict."""
      detected = mode if mode != "auto" else _detect_payload_mode(payload)
  
      if detected == "veteran":
          return _wrap_veteran_payload(payload, source_file)
      elif detected == "advocate":
          return _wrap_advocate_payload(payload, source_file)
      elif detected in ("coding_assistant", "unknown"):
          return _wrap_coding_payload(payload, source_file)
      # hybrid payloads are a mix — detect per-item
      return _wrap_coding_payload(payload, source_file)
  
  
  # ---------------------------------------------------------------------------
  # Main scoring pass
  # ---------------------------------------------------------------------------
  
  def run_scoring_pass(
      input_dir: Path,
      output_dir: Path,
      mode: str = "auto",
      config_path: str = "config/engine_config.yaml",
  ) -> Dict[str, Any]:
      """
      Read extracted payloads, wrap into AletheiaSkill nodes, run DAG scoring,
      write scored results back. Returns summary statistics.
      """
      if not input_dir.exists():
          logger.error(f"Input directory does not exist: {input_dir}")
          return {"status": "error", "reason": "input_dir_missing"}
  
      output_dir.mkdir(parents=True, exist_ok=True)
  
      # Collect all payloads from extraction output
      all_nodes: List[Dict[str, Any]] = []
      source_map: Dict[str, str] = {}  # node_id → source_file
  
      for file_path in sorted(input_dir.glob("*.*")):
          if file_path.suffix not in (".json", ".yaml", ".yml"):
              continue
  
          try:
              with open(file_path, "r", encoding="utf-8") as f:
                  if file_path.suffix in (".yaml", ".yml"):
                      data = yaml.safe_load(f)
                  else:
                      data = json.load(f)
          except Exception as e:
              logger.warning(f"Failed to parse {file_path.name}: {e}")
              continue
  
          # Flatten nested lists
          payloads = []
          if isinstance(data, list):
              for item in data:
                  if isinstance(item, list):
                      payloads.extend(item)
                  elif isinstance(item, dict):
                      payloads.append(item)
          elif isinstance(data, dict):
              # Could be a single payload or a wrapper
              skills = data.get("capability_injection", {}).get("compiled_skills", [])
              if skills:
                  payloads.extend(skills)
              else:
                  payloads.append(data)
  
          for payload in payloads:
              wrapped = wrap_payload(payload, mode, file_path.name)
              if wrapped:
                  source_map[wrapped["node_id"]] = file_path.name
                  all_nodes.append(wrapped)
  
      if not all_nodes:
          logger.warning("No payloads found in input directory")
          return {"status": "empty", "nodes_processed": 0}
  
      logger.info(f"Loaded {len(all_nodes)} payloads for DAG scoring (mode={mode})")
  
      # Determine effective mode for DAGRuntime
      dag_mode = mode if mode in ("theorist", "coding_assistant", "advocate", "veteran") else "coding_assistant"
      # If auto-detect, use most common mode
      if mode == "auto":
          from collections import Counter
          mode_counts = Counter(
              (n.get("semantics") or {}).get("orchestration_mode", "coding_assistant") for n in all_nodes
          )
          dag_mode = mode_counts.most_common(1)[0][0]
          if dag_mode not in ("theorist", "coding_assistant", "advocate", "veteran"):
              dag_mode = "coding_assistant"
          logger.info(f"Auto-detected dominant mode: {dag_mode}")
  
      # Build DAG and run scoring
      graph = InMemoryEpistemicGraph(all_nodes)
      acs = ACSExecutionGovernor(config_path=config_path)
      runtime = DAGRuntime(graph=graph, acs=acs, mode=dag_mode)
  
      logger.info(f"Running DAG scoring pass with {len(graph.nodes)} valid nodes ({len(graph.quarantine)} quarantined)")
  
      runtime.run()
  
      # Collect scored results
      scored_nodes = []
      accepted = 0
      rejected = 0
  
      for node_id, node in graph.nodes.items():
          node_dict = node.model_dump(exclude_unset=False)
          # Sanitize internal scoring mechanics (Phase 4: leakage prevention)
          node_dict = sanitize_scored_node(node_dict)
          # Preserve original semantics for formatter
          state = node.epistemic.state
          if state in ("ACCEPTED", "terminal"):
              accepted += 1
          else:
              rejected += 1
          scored_nodes.append(node_dict)
  
      # Write scored nodes
      output_file = output_dir / "dag_scored_nodes.json"
      with open(output_file, "w", encoding="utf-8") as f:
          json.dump(scored_nodes, f, indent=2, default=str)
  
      logger.info(f"Wrote {len(scored_nodes)} scored nodes to {output_file}")
  
      # Write rejected traces if any
      rejected_trace_count = 0
      if runtime.rejected_traces:
          traces_file = output_dir / "rejected_traces.json"
          with open(traces_file, "w", encoding="utf-8") as f:
              json.dump(runtime.rejected_traces, f, indent=2, default=str)
          rejected_trace_count = len(runtime.rejected_traces)
          logger.info(f"Wrote {rejected_trace_count} rejected traces to {traces_file}")
  
      # Write telemetry snapshot
      if runtime.telemetry:
          telemetry_file = output_dir / "dag_telemetry.json"
          with open(telemetry_file, "w", encoding="utf-8") as f:
              json.dump(runtime.telemetry.snapshot(), f, indent=2)
  
      summary = {
          "status": "completed",
          "nodes_processed": len(scored_nodes),
          "accepted": accepted,
          "rejected": rejected,
          "quarantined": len(graph.quarantine),
          "rejected_traces": rejected_trace_count,
          "mode": dag_mode,
      }
      logger.info(f"DAG scoring pass complete: {summary}")
      return summary
  
  
  if __name__ == "__main__":
      parser = argparse.ArgumentParser(description="Aletheia Post-Extraction DAG Scoring Pass")
      parser.add_argument("input_dir", help="Path to knowledge_complexes directory with extracted payloads")
      parser.add_argument("--output-dir", help="Output directory (defaults to input_dir)", default=None)
      parser.add_argument("--mode", choices=["auto", "theorist", "coding_assistant", "advocate", "veteran", "hybrid"],
                          default="auto", help="Extraction mode (auto-detects if not specified)")
      parser.add_argument("--config", default="config/engine_config.yaml", help="Engine config path")
  
      args = parser.parse_args()
      input_path = Path(args.input_dir)
      output_path = Path(args.output_dir) if args.output_dir else input_path
  
      result = run_scoring_pass(input_path, output_path, mode=args.mode, config_path=args.config)
      sys.exit(0 if result.get("status") == "completed" else 1)

